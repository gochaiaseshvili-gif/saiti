<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iyidebaa.ge - ონლაინ მაღაზია</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- ჰედერი -->
    <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black text-green-400">iyidebaa.ge</span>
            </div>
            
            <div class="flex items-center space-x-3">
                <!-- მართვის პანელის ღილაკი -->
                <button onclick="toggleAdminPanel()" class="bg-gray-700 hover:bg-gray-600 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center space-x-2 transition-all">
                    <i class="fa-solid fa-gear"></i>
                    <span>მართვის პანელი</span>
                </button>

                <!-- ძველი ენების ღილაკები -->
                <div id="language-buttons" class="flex space-x-1">
                    <button onclick="setLanguage('ka')" class="px-2.5 py-1 text-xs rounded bg-green-600 text-white font-bold">GE</button>
                    <button onclick="setLanguage('en')" class="px-2.5 py-1 text-xs rounded bg-gray-700 text-gray-300">EN</button>
                    <button onclick="setLanguage('ru')" class="px-2.5 py-1 text-xs rounded bg-gray-700 text-gray-300">RU</button>
                </div>
            </div>
        </div>
    </header>

    <!-- მთავარი კონტენტი -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-6 w-full">
        
        <!-- ბანერი -->
        <section class="mb-8 p-6 rounded-2xl bg-gray-800 border border-gray-700 shadow-lg">
            <h1 class="text-3xl font-extrabold mb-2 text-white">საუკეთესო პროდუქტები ადგილზე მიწოდებით</h1>
            <p class="text-gray-400 text-sm">აირჩიეთ სასურველი პროდუქტი და შეუკვეთეთ მარტივად.</p>
        </section>

        <!-- პროდუქტების ბადე -->
        <section id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- პროდუქტის კარტა -->
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 shadow-lg flex flex-col justify-between">
                <div>
                    <div class="h-48 rounded-lg overflow-hidden bg-gray-700 mb-4">
                        <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?auto=format&fit=crop&w=600&q=80" alt="პროდუქტი" class="w-full h-full object-cover">
                    </div>
                    <h3 class="text-lg font-bold text-white mb-1">კარაოკე სისტემა / პროდუქტი</h3>
                    <p class="text-green-400 font-bold text-lg mb-4">₾250</p>
                </div>
                <div class="space-y-2">
                    <button onclick="openProductModal(1)" class="w-full bg-green-600 hover:bg-green-500 text-white font-semibold py-2 px-4 rounded-lg transition-all text-sm flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-eye"></i>
                        <span>დეტალურად ნახვა</span>
                    </button>
                    <div class="grid grid-cols-3 gap-2">
                        <a href="https://wa.me/" target="_blank" class="bg-emerald-700/30 text-emerald-400 border border-emerald-500/30 py-1.5 rounded text-center text-xs font-semibold flex items-center justify-center space-x-1">
                            <i class="fa-brands fa-whatsapp"></i> <span>WhatsApp</span>
                        </a>
                        <a href="viber://chat?number=" class="bg-purple-700/30 text-purple-400 border border-purple-500/30 py-1.5 rounded text-center text-xs font-semibold flex items-center justify-center space-x-1">
                            <i class="fa-brands fa-viber"></i> <span>Viber</span>
                        </a>
                        <a href="https://t.me/" target="_blank" class="bg-sky-700/30 text-sky-400 border border-sky-500/30 py-1.5 rounded text-center text-xs font-semibold flex items-center justify-center space-x-1">
                            <i class="fa-brands fa-telegram"></i> <span>Telegram</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- ფუტერი -->
    <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-sm text-gray-400 mt-auto">
        <p>&copy; 2026 iyidebaa.ge — ყველა უფლება დაცულია.</p>
    </footer>

    <!-- სკრიპტები -->
    <script>
        function setLanguage(lang) {
            console.log('Language:', lang);
        }
        function openProductModal(id) {
            console.log('Product modal:', id);
        }
        function toggleAdminPanel() {
            alert('მართვის პანელის გახსნა');
        }
    </script>
</body>
</html>
